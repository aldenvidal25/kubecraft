name: mixed-lab

topology:
  nodes:
    # Nokia SR Linux node
    router:
      kind: srl
      image: ghcr.io/nokia/srlinux:24.10.1

    # Linux node
    host1:
      kind: linux
      image: alpine:3.20
  links:
    - endpoints: ["router:e1-1", "host1:eth1"] # Connect router's e1-1 to host's eth1
